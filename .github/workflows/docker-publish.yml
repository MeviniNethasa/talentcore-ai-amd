name: Compile and Publish Hackathon Docker Image

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository code context layers
        uses: actions/checkout@v4

      - name: Convert image repository target name to lowercase
        id: prep
        run: |
          # Enforces entirely lowercase strings to satisfy ghcr.io registry parameters
          echo "tag=ghcr.io/mevininethasa/talentcore-ai-amd:latest" >> $GITHUB_OUTPUT

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the compiled Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.tag }}
