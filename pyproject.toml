[project]
name = "interviewer_agent"
version = "0.1.0"
description = "interviewer_agent using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.14.7",
    "fastapi[standard]>=0.139.0",
    "litellm>=1.90.3",
    "passlib[bcrypt]>=1.7.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.51",
    "streamlit>=1.58.0",
]

[project.scripts]
interviewer_agent = "interviewer_agent.main:run"
run_crew = "interviewer_agent.main:run"
train = "interviewer_agent.main:train"
replay = "interviewer_agent.main:replay"
test = "interviewer_agent.main:test"
run_with_trigger = "interviewer_agent.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
